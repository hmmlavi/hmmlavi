<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Selected Projects</title>
<desc id="desc">A minimal animated showcase of five projects by Lakshit Singh.</desc>
<defs>
  <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#C4B5FD" stop-opacity=".16"/>
    <stop offset="1" stop-color="#79C7C5" stop-opacity=".025"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C4B5FD"/>
    <stop offset="1" stop-color="#8B9CF6"/>
  </linearGradient>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .muted { fill:#8B91A3; font-size:12px; letter-spacing:1.5px; }
    .heading { fill:#F3F1FA; font-size:24px; font-weight:650; }
    .sub { fill:#A6A9B8; font-size:13px; }
    .card { fill:#10131D; stroke:#292D3A; stroke-width:1; transition:stroke .25s ease, transform .25s ease; }
    .num { fill:#A78BFA; font-size:12px; font-weight:650; letter-spacing:1px; }
    .name { fill:#F3F1FA; font-size:19px; font-weight:650; }
    .desc { fill:#A6A9B8; font-size:13px; }
    .tag { fill:#C4B5FD; font-size:10px; letter-spacing:1.1px; }
    .dot { animation:pulse 2.8s ease-in-out infinite; transform-origin:center; }
    .shine { animation:drift 7s ease-in-out infinite; }
    .card:hover { stroke:#8B7ACB; }
    .accentLine { opacity:.75; }
    @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.85); } 50% { opacity:1; transform:scale(1.15); } }
    @keyframes drift { 0%,100% { opacity:.15; transform:translateX(0); } 50% { opacity:.5; transform:translateX(16px); } }
    @media(prefers-reduced-motion:reduce) { .dot,.shine { animation:none; } }
  </style>
</defs>

<rect x="1" y="1" width="1198" height="758" rx="18" fill="#070910" stroke="#292D3A"/>
<rect x="2" y="2" width="1196" height="126" rx="17" fill="url(#headerGlow)"/>
<text x="64" y="47" class="muted">HMMLAVI  /  SELECTED WORK</text>
<text x="64" y="83" class="heading">Things I've been building.</text>
<text x="64" y="106" class="sub">A few ideas turned into working software.</text>
<circle class="dot" cx="1110" cy="50" r="4" fill="#79C7C5"/>
<text x="1136" y="54" text-anchor="end" class="muted">05 PROJECTS</text>
<path d="M64 128H1136" stroke="url(#accent)" stroke-width="1" opacity=".5"/>
<path class="shine" d="M64 128H360" stroke="#C4B5FD" stroke-width="2" opacity=".3"/>

<a href="https://github.com/hmmlavi/sortify-desktop" target="_blank">
  <rect class="card" x="64" y="158" width="520" height="220" rx="14"/>
  <rect x="64" y="158" width="3" height="220" rx="1.5" fill="#C4B5FD" class="accentLine"/>
  <text x="92" y="194" class="num">01  /  DESKTOP APP</text>
  <text x="92" y="233" class="name">Sortify Desktop</text>
  <text x="92" y="266" class="desc">Finds files by understanding their contents,</text>
  <text x="92" y="287" class="desc">then helps rename and organize them safely.</text>
  <text x="92" y="345" class="tag">FILE ORGANIZATION  ·  WINDOWS</text>
  <text x="548" y="345" text-anchor="end" class="num">↗</text>
</a>

<a href="https://github.com/hmmlavi/FacilityFix" target="_blank">
  <rect class="card" x="616" y="158" width="520" height="220" rx="14"/>
  <rect x="616" y="158" width="3" height="220" rx="1.5" fill="#8B9CF6" class="accentLine"/>
  <text x="644" y="194" class="num">02  /  CAMPUS SYSTEM</text>
  <text x="644" y="233" class="name">FacilityFix</text>
  <text x="644" y="266" class="desc">A shared workflow for reporting campus issues,</text>
  <text x="644" y="287" class="desc">tracking maintenance, and managing resolutions.</text>
  <text x="644" y="345" class="tag">ISSUE REPORTING  ·  MANAGEMENT</text>
  <text x="1100" y="345" text-anchor="end" class="num">↗</text>
</a>

<a href="https://github.com/hmmlavi/Pustakalaya-LMS" target="_blank">
  <rect class="card" x="64" y="402" width="520" height="220" rx="14"/>
  <rect x="64" y="402" width="3" height="220" rx="1.5" fill="#79C7C5" class="accentLine"/>
  <text x="92" y="438" class="num">03  /  LIBRARY MANAGEMENT</text>
  <text x="92" y="477" class="name">Pustakalaya LMS</text>
  <text x="92" y="510" class="desc">A local-first system for books, members, circulation,</text>
  <text x="92" y="531" class="desc">reservations, fines, and everyday library operations.</text>
  <text x="92" y="589" class="tag">PYTHON  ·  FLASK  ·  SQLITE</text>
  <text x="548" y="589" text-anchor="end" class="num">↗</text>
</a>

<a href="https://github.com/hmmlavi/Veylo" target="_blank">
  <rect class="card" x="616" y="402" width="520" height="220" rx="14"/>
  <rect x="616" y="402" width="3" height="220" rx="1.5" fill="#E6A5C8" class="accentLine"/>
  <text x="644" y="438" class="num">04  /  HABIT TRACKER</text>
  <text x="644" y="477" class="name">Veylo</text>
  <text x="644" y="510" class="desc">A focused space to organize daily habits, shape</text>
  <text x="644" y="531" class="desc">routines, and keep an eye on personal progress.</text>
  <text x="644" y="589" class="tag">ROUTINES  ·  CONSISTENCY</text>
  <text x="1100" y="589" text-anchor="end" class="num">↗</text>
</a>

<a href="https://github.com/hmmlavi/SaBuddy" target="_blank">
  <rect class="card" x="64" y="646" width="1072" height="82" rx="14"/>
  <rect x="64" y="646" width="3" height="82" rx="1.5" fill="#A78BFA" class="accentLine"/>
  <text x="92" y="678" class="num">05  /  CONTENT PLANNER</text>
  <text x="92" y="704" class="name" font-size="17">SaBuddy</text>
  <text x="330" y="681" class="desc">An Android workspace for content ideas, captions, scripts, and planning ahead.</text>
  <text x="1100" y="692" text-anchor="end" class="num">↗</text>
</a>

<text x="64" y="746" class="muted" font-size="10">DESIGNED &amp; BUILT WITH CURIOSITY</text>
<text x="1136" y="746" text-anchor="end" class="muted" font-size="10">OPEN A PROJECT ↗</text>
</svg>