<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Tools of the Trade</title>
  <desc id="desc">A warm minimal illustration of a dark terminal window beneath the title Tools of the Trade.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13"/>
      <feOffset dy="15"/>
      <feComponentTransfer><feFuncA type="linear" slope=".24"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242326"/>
      <stop offset="1" stop-color="#171719"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="950" height="430" rx="24" fill="#fff0e4" stroke="#27232d" stroke-width="5"/>
  <text x="52" y="88" fill="#29242d" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="-1.4">Tools of the Trade</text>
  <path d="M54 108 H210" stroke="#b77d67" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="118" y="145" width="724" height="238" rx="15" fill="url(#screen)" stroke="#5a565d" stroke-width="2"/>
    <path d="M133 145 H827 Q842 145 842 160 V178 H118 V160 Q118 145 133 145Z" fill="#3b393e"/>
    <circle cx="145" cy="162" r="7" fill="#ff6058"/>
    <circle cx="170" cy="162" r="7" fill="#ffbd2e"/>
    <circle cx="195" cy="162" r="7" fill="#28c840"/>
    <text x="480" y="167" text-anchor="middle" fill="#d8d4da" font-family="SFMono-Regular, Consolas, monospace" font-size="13">lavi@workspace · zsh</text>
    <text x="145" y="218" fill="#f2edf2" font-family="SFMono-Regular, Consolas, monospace" font-size="17">
      <tspan fill="#9ed7a5">lavi@workspace</tspan><tspan fill="#d8d4da"> ~ % </tspan><tspan fill="#f2edf2">ls tools/</tspan>
    </text>
    <text x="145" y="253" fill="#d8d4da" font-family="SFMono-Regular, Consolas, monospace" font-size="15">code     build     create     explore</text>
    <text x="145" y="296" fill="#f2edf2" font-family="SFMono-Regular, Consolas, monospace" font-size="17">
      <tspan fill="#9ed7a5">lavi@workspace</tspan><tspan fill="#d8d4da"> ~ % </tspan><tspan fill="#f2edf2">_</tspan>
    </text>
