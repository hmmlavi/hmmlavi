    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".10"/>
    </linearGradient>
    <style>
      .h{font:600 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;letter-spacing:2.5px;fill:#E6EDF3}
      .l{font:600 9px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;letter-spacing:1px;fill:#6E7681}
      .s{font:500 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6E7681}
    </style>
  </defs>

