<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Lakshit Singh Saini</title>
  <desc id="desc">A soft claymorphism-inspired profile header in warm cream, lavender and peach.</desc>
  <defs>
    <filter id="clay" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset dx="7" dy="9" result="offset"/>
      <feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".19"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4e9"/>
      <stop offset="1" stop-color="#f2eafa"/>
    </linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4d7f5"/>
      <stop offset="1" stop-color="#cbb9e8"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0cc"/>
      <stop offset="1" stop-color="#f4c4ae"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="1184" height="344" rx="34" fill="url(#bg)" stroke="#e5d9e8" stroke-width="3"/>
  <circle cx="1045" cy="80" r="78" fill="#e7def4" opacity=".65"/>
  <circle cx="1120" cy="280" r="110" fill="#f9dfd1" opacity=".55"/>
  <circle cx="90" cy="300" r="95" fill="#e2eee5" opacity=".65"/>
  <g filter="url(#clay)">
    <rect x="82" y="78" width="1036" height="205" rx="30" fill="#fffaf5" stroke="#ffffff" stroke-width="3"/>
    <rect x="112" y="106" width="12" height="148" rx="6" fill="url(#lav)"/>
    <rect x="148" y="218" width="180" height="34" rx="17" fill="url(#peach)"/>
    <rect x="346" y="218" width="148" height="34" rx="17" fill="url(#lav)"/>
    <rect x="512" y="218" width="170" height="34" rx="17" fill="#dce9df"/>
    <circle cx="1020" cy="130" r="25" fill="url(#peach)"/>
    <circle cx="1060" cy="175" r="15" fill="url(#lav)"/>
    <circle cx="1000" cy="205" r="10" fill="#dce9df"/>
  </g>
  <text x="150" y="164" fill="#342d3d" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.8">Lakshit Singh Saini</text>
  <text x="152" y="195" fill="#82758b" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2.4">COMPUTER SCIENCE STUDENT · BUILDER · EXPLORER</text>
  <g fill="#675b72" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <text x="238" y="240">BUILD</text><text x="420" y="240">EXPLORE</text><text x="597" y="240">CREATE</text>
  </g>
</svg>