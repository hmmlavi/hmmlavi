<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" fill="none">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161B22"/><stop offset="1" stop-color="#090D12"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#58A6FF" stop-opacity="0"/><stop offset=".5" stop-color="#58A6FF" stop-opacity=".7"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#58A6FF" stop-opacity=".24"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
    <style>
      .eyebrow{font:600 10px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;letter-spacing:3px;fill:#8B949E}
      .headline{font:600 22px -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;letter-spacing:1.1px;fill:#E6EDF3}
      .sub{font:400 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8B949E}
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="188" rx="16" fill="url(#panel)" stroke="#30363D"/>
  <path d="M18 2H882" stroke="#fff" stroke-opacity=".12"/>
  <circle cx="735" cy="94" r="94" fill="url(#glow)"/>
  <g transform="translate(735 94)">
    <circle r="28" stroke="#58A6FF" stroke-opacity=".45" stroke-width="1"/>
    <circle r="48" stroke="#8B949E" stroke-opacity=".35" stroke-dasharray="2 7"/>
    <circle r="68" stroke="#58A6FF" stroke-opacity=".28" stroke-dasharray="1 8"/>
    <ellipse rx="68" ry="25" transform="rotate(-32)" stroke="#8B949E" stroke-opacity=".3"/>
    <circle r="7" fill="#58A6FF" fill-opacity=".9"/>
    <circle r="3" cx="48" cy="0" fill="#E6EDF3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" cx="0" cy="-68" fill="#58A6FF">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" cx="-25" cy="0" fill="#E6EDF3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </circle>
    <path d="M-82 0H82 M0 -82V82" stroke="#8B949E" stroke-opacity=".12"/>
    <circle r="76" stroke="#58A6FF" stroke-opacity=".45" stroke-dasharray="18 460">
      <animate attributeName="stroke-dashoffset" values="0;-478" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M24 145H876" stroke="#30363D"/>
  <path d="M24 145H260" stroke="url(#beam)" stroke-width="2">
    <animate attributeName="x1" values="-240;900" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1140" dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="34" y="52" class="eyebrow">LAKSHIT  /  DEVELOPER PROFILE</text>
  <text x="34" y="91" class="headline">ENGINEERING IDEAS INTO</text>
  <text x="34" y="119" class="headline">USEFUL SOFTWARE.</text>
  <text x="35" y="169" class="sub">CSE UNDERGRAD  ·  FULL-STACK  ·  OPEN-SOURCE BUILDER</text>
</svg>