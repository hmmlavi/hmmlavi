name: Refresh profile dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-visuals.yml"
      - "scripts/generate_dashboard.py"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Generate custom dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_dashboard.py

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/dashboard.svg
          git commit -m "Refresh developer dashboard" || exit 0
          git push
