<svg width="400" height="190" viewBox="0 0 400 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="frost">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="2" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="m"/>
      <feComponentTransfer in="m"><feFuncA type="table" tableValues="0 .07 0 .05 0 .03"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="c"><rect x="10" y="8" width="380" height="162" rx="20"/></clipPath>
    <style>
      .t{font:600 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;letter-spacing:3px;fill:#F0F3F6}
      .p{font:400 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#C9D1D9}
      .m{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E6EDF3}
    </style>
  </defs>

  <ellipse cx="200" cy="176" rx="150" ry="10" fill="#000" opacity=".35"/>
  <rect x="10" y="8" width="380" height="162" rx="20" fill="#07090C" fill-opacity=".28" filter="url(#shadow)"/>

  <g clip-path="url(#c)">
    <rect x="10" y="8" width="380" height="162" fill="#07090C" fill-opacity=".32"/>
    <rect x="10" y="8" width="380" height="162" fill="url(#fill)"/>
    <ellipse cx="70" cy="8" rx="95" ry="52" fill="#fff" fill-opacity=".16" filter="url(#blur)"/>
    <ellipse cx="330" cy="155" rx="90" ry="48" fill="#fff" fill-opacity=".07" filter="url(#blur)"/>
    <rect x="10" y="8" width="380" height="162" filter="url(#frost)" opacity=".28"/>
    <rect x="10" y="8" width="380" height="72" fill="url(#sheen)"/>
    <path d="M32 9.2H368" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/>
  </g>

  <rect x="10.6" y="8.6" width="378.8" height="160.8" rx="20" fill="none" stroke="url(#rim)" stroke-width="1.15"/>
  <rect x="12.2" y="10.2" width="375.6" height="157.6" rx="18.5" fill="none" stroke="#fff" stroke-opacity=".08"/>

  <text x="28" y="38" class="t">✦ ABOUT</text>
  <text x="28" y="70" class="p">CSE undergrad who codes across the stack —</text>
  <text x="28" y="90" class="p">from low-level C/C++ to production-ready</text>
  <text x="28" y="110" class="p">web and mobile apps.</text>
  <path d="M28 128H372" stroke="#fff" stroke-opacity=".10"/>
  <text x="28" y="150" class="m">◈  Python · C · C++ · TypeScript</text>
</svg>
